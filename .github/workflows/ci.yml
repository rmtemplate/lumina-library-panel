name: CI

# Runs on every PR and every push to main. Two independent checks:
#   1. Pest test suite against MySQL (the schema migration is a raw MySQL dump,
#      so tests can't use sqlite — see phpunit.xml)
#   2. The production Docker image actually builds (multi-stage, incl. Vite)
# Deploy (deploy.yml) only fires after THIS workflow succeeds on main.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pest tests (PHP 8.3 + MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lumina_library_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: lumina_library_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, exif, gd, intl, pdo_mysql, zip, redis, pcntl
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Prepare .env
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test --no-coverage

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build only (no push) — proves the multi-stage Dockerfile (composer +
      # Vite + PHP-FPM runtime) is valid before we ever try to deploy it.
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: lumina-library-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: false
          load: false
          tags: lumina-library-nginx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
