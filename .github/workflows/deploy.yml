name: Deploy

# Zero-touch production deploy. Fires after "Publish Docker images" succeeds on
# main (so the GHCR images exist), or manually. SSHes into the VPS and runs
# scripts/update.sh in PULL mode: backup DB -> git pull (compose/.env) ->
# `docker compose pull` the GHCR images -> recreate changed containers ->
# wait for health.
#
# On boot the app container auto-runs migrations + config/route/view/event
# caching, and Reverb / queue / scheduler come up under supervisor — nothing
# here touches them by hand (see docker/php/entrypoint.sh).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     VPS hostname or IP
#   DEPLOY_USER     SSH user that owns the deploy directory
#   DEPLOY_SSH_KEY  private key (PEM) whose public half is in authorized_keys
#   DEPLOY_PORT     SSH port (usually 22)
#   DEPLOY_PATH     absolute path to the cloned repo on the VPS (contains .env)
# Optional (only if the GHCR packages are PRIVATE):
#   GHCR_USER       GitHub username with read:packages
#   GHCR_TOKEN      a PAT (classic) with read:packages

on:
  workflow_run:
    workflows: ["Publish Docker images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 20m
          script_stop: true
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only
            # Only needed if the GHCR packages are private.
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            fi
            LUMINA_PULL_IMAGES=true ./scripts/update.sh
