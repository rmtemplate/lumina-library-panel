name: Deploy

# Zero-touch production deploy. Fires automatically once CI passes on main
# (or manually via "Run workflow"). SSHes into the VPS and runs
# scripts/update.sh, which backs up the DB, git-checks-out this exact commit,
# rebuilds the images, and recreates only the changed containers.
#
# On boot the app container auto-runs migrations + config/route/view/event
# caching, and Reverb / queue / scheduler come up under supervisor — so
# nothing here needs to touch them by hand (see docker/php/entrypoint.sh).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     VPS hostname or IP
#   DEPLOY_USER     SSH user that owns the deploy directory
#   DEPLOY_SSH_KEY  private key (PEM) whose public half is in the server's authorized_keys
#   DEPLOY_PORT     SSH port (usually 22)
#   DEPLOY_PATH     absolute path to the cloned repo on the VPS (contains .env)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Auto-deploy only when CI succeeded; manual runs always proceed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all --tags --prune
            ./scripts/update.sh "${{ github.sha }}"
