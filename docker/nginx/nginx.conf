user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

# Docker captures stderr/stdout — never write logs to the container
# filesystem (see "Logging" in docs/deployment.md).
error_log /dev/stderr warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Uploads (avatar/book cover photos) — see php/conf.d/zz-app.ini for
    # the matching PHP-side upload_max_filesize/post_max_size.
    client_max_body_size 25m;
    client_body_buffer_size 128k;

    # ── Gzip ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.api+json
        font/woff2
        image/svg+xml;

    # Real client IP when sitting behind Nginx Proxy Manager / Cloudflare —
    # both proxy through Docker's bridge network, so trust the immediate
    # upstream hop. Add real_ip_from entries for Cloudflare's published
    # ranges if you proxy through Cloudflare directly (see docs/deployment.md
    # "SSL").
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/conf.d/*.conf;
}
