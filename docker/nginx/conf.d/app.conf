# Lumina Library — Nginx server block.
#
# Terminates plain HTTP only. TLS is handled upstream by whichever
# reverse proxy you put in front of this container (Nginx Proxy Manager,
# Cloudflare Tunnel/Proxy, or your own certbot+nginx) — see "SSL" in
# docs/deployment.md. This container never sees, mounts, or hardcodes a
# certificate.

upstream php_fpm {
    server app:9000;
}

upstream reverb {
    server reverb:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # ── Security headers ─────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Only sent once a request actually arrives over HTTPS (i.e. the
    # upstream proxy terminated TLS and forwarded X-Forwarded-Proto) —
    # never forces HTTPS on plain-HTTP container-to-container traffic.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Healthcheck (no PHP involved — used by the Dockerfile HEALTHCHECK
    #    and can also be pointed to by Nginx Proxy Manager / uptime checks) ─
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Laravel Reverb — WebSocket + Pusher-protocol HTTP API ────────────
    # /app/{key}  -> client WebSocket connections (Flutter app)
    # /apps/{id}/... -> server-side publish calls (Laravel's own broadcaster)
    # Both proxy to the same upstream; the upgrade headers only take effect
    # when the client actually requests a protocol upgrade.
    location ~ ^/(app|apps)/ {
        proxy_pass http://reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ── Uploaded files (avatars, book covers) ────────────────────────────
    # Served directly from the shared storage volume — bypasses both PHP
    # and the public/storage symlink (which can't resolve reliably across
    # separately-mounted container filesystems).
    # `^~` makes these two take priority over the regex locations below —
    # without it, a request like /storage/covers/x.jpg would match the
    # generic file-extension regex first (since regex locations win over a
    # plain-prefix match) and lose the `alias`/cache-control defined here.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # ── Vite build output (content-hashed filenames -> safe to cache
    #    forever; a new deploy ships new filenames, never reuses old ones) ─
    location ^~ /build/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── Other static assets ──────────────────────────────────────────────
    location ~* \.(?:css|js|map|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        access_log off;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # ── Laravel front controller ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    # ── Deny dotfiles (.env, .git, ...) ──────────────────────────────────
    # Belt-and-suspenders only — `root` is /var/www/html/public, so
    # .env/composer.json/artisan/storage/app (private) are already outside
    # the document root and unreachable regardless of this rule.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
