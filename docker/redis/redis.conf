# Lumina Library — Redis configuration for a small/medium VPS.
# `--requirepass` is supplied at runtime via docker-compose.yml's
# `command:` override (from .env's REDIS_PASSWORD) — never hardcoded here.

# Persistence: AOF (append-only file) survives a container restart with
# minimal data loss — used for cache, sessions, queue jobs, and Reverb's
# scaling channel, all of which matter more than raw throughput here.
appendonly yes
appendfsync everysec

# RDB snapshots as a secondary safety net.
save 900 1
save 300 10
save 60 10000

# Evict least-recently-used keys once full rather than refusing writes —
# acceptable for cache/session data; queue jobs and AOF persistence are
# unaffected by this policy (it only applies to eviction under memory
# pressure, not to data safety).
maxmemory 256mb
maxmemory-policy allkeys-lru

# Bind to all interfaces inside the container's own network namespace —
# safe because `internal` is a private Docker bridge network with no
# host port published for Redis (see docker-compose.yml).
bind 0.0.0.0
protected-mode yes

# Docker logs, not a file inside the container.
logfile ""
