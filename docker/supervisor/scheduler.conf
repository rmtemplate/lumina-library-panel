; Supervisor config for the `scheduler` container.
; Runs as PID 1 via: supervisord -n -c /etc/supervisor/scheduler.conf
;
; Deliberately NOT VPS crontab — `schedule:work` is Laravel's own
; recommended approach for containerized deployments: a single
; long-running process that wakes up every 60s and runs whatever
; routes/console.php has scheduled (see docs/staff-module.md's scheduled
; jobs, e.g. lumina:flag-overdue-borrowings). One process, one container,
; no host-level cron dependency at all.

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:scheduler]
command=php artisan schedule:work
directory=/var/www/html
user=www-data
numprocs=1
autostart=true
autorestart=true
startretries=10
startsecs=3
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
