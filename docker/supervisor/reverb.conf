; Supervisor config for the `reverb` container.
; Runs as PID 1 via: supervisord -n -c /etc/supervisor/reverb.conf

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ── Laravel Reverb (WebSocket server) ───────────────────────────────────
; host/port/environment come from REVERB_SERVER_HOST / REVERB_SERVER_PORT
; (config/reverb.php) — already supplied via the container's env_file, so
; no flags are hardcoded here. 0.0.0.0 is required for Docker's network
; bridge to forward Nginx's proxied connections in at all.
[program:reverb]
command=php artisan reverb:start --host=%(ENV_REVERB_SERVER_HOST)s --port=%(ENV_REVERB_SERVER_PORT)s
directory=/var/www/html
user=www-data
numprocs=1
autostart=true
autorestart=true
startretries=10
startsecs=3
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
