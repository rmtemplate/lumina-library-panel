; Supervisor config for the `queue` container.
; Runs as PID 1 via: supervisord -n -c /etc/supervisor/queue.conf

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ── Queue workers ────────────────────────────────────────────────────────
; numprocs=2 -> two parallel worker processes sharing the same queue.
; --max-time=3600 makes each worker exit cleanly once an hour; autorestart
; immediately brings it back up — a deliberate, supervised recycle that
; avoids slow memory growth across long-lived PHP processes, rather than
; an actual crash/restart loop.
[program:queue-worker]
command=php artisan queue:work redis --queue=default,payments,notifications --sleep=3 --tries=3 --backoff=5 --max-time=3600 --timeout=120
directory=/var/www/html
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startretries=10
startsecs=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
