[www]
user = www-data
group = www-data

listen = 9000
listen.owner = www-data
listen.group = www-data

; ── Process manager ──────────────────────────────────────────────────────
; "dynamic" balances memory use against burst capacity for a small/medium
; VPS. Tune pm.max_children to (available RAM for PHP) / (avg worker RSS,
; typically 40-60MB for this app) — see docs/deployment.md "Troubleshooting".
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; ── Healthcheck endpoints (used by the Dockerfile HEALTHCHECK) ──────────
pm.status_path = /status
ping.path = /ping

; ── Logging ───────────────────────────────────────────────────────────────
; stdout/stderr -> Docker logs, never a file inside the container.
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

clear_env = no
