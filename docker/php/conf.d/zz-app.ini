; Lumina Library — production PHP overrides.
; Named zz-app.ini so it loads (and wins) after every other conf.d file
; php:8.3-fpm-alpine ships by default.

; ── General ──────────────────────────────────────────────────────────────
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
post_max_size = 25M
upload_max_filesize = 20M
max_file_uploads = 20
expose_php = Off

; ── Error handling ───────────────────────────────────────────────────────
; Errors go to stderr (-> Docker logs), never to a file inside the
; container — see "Logging" in docs/deployment.md.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; ── Sessions ──────────────────────────────────────────────────────────────
; Laravel manages its own session driver (Redis in production); PHP's
; native session handler is unused but harmless to leave at safe defaults.
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

; ── OPcache ───────────────────────────────────────────────────────────────
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.jit_buffer_size = 0

; ── Realpath cache (fewer stat() syscalls for a large Laravel vendor tree) ─
realpath_cache_size = 4096k
realpath_cache_ttl = 600
