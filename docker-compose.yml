name: lumina-library

# ─────────────────────────────────────────────────────────────────────────
# Lumina Library — production stack.
#
# All Laravel-facing services (app/queue/scheduler/reverb) share ONE image
# (built once from the root Dockerfile) and differ only by CONTAINER_ROLE
# — see docker/php/entrypoint.sh. This keeps the stack modular without
# duplicating the Dockerfile four times.
#
# MySQL is included by default but fully optional — if you point DB_HOST
# at an already-existing/managed database, comment out the `mysql` service
# and its `depends_on`/volume entries (see docs/deployment.md).
# ─────────────────────────────────────────────────────────────────────────

x-app-image: &app-image
  # Local `docker compose build` tags this; on the server set APP_IMAGE in .env
  # to the GHCR tag (e.g. ghcr.io/OWNER/lumina-library-app:latest) and use
  # `docker compose pull` to run the CI-built image instead of building.
  build:
    context: .
    dockerfile: Dockerfile
  image: ${APP_IMAGE:-lumina-library-app:latest}
  env_file:
    - .env
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - internal
  volumes:
    - storage_public:/var/www/html/storage/app/public
  restart: unless-stopped
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ── Web (PHP-FPM) ──────────────────────────────────────────────────────
  app:
    <<: *app-image
    container_name: apps-lumina-app
    environment:
      CONTAINER_ROLE: app
    healthcheck:
      test: ["CMD", "sh", "-c", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ── Nginx reverse proxy ────────────────────────────────────────────────
  # Plain HTTP only (port 80) — TLS termination happens upstream (Nginx
  # Proxy Manager / Cloudflare / your own certbot+nginx). See "SSL" in
  # docs/deployment.md.
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: ${NGINX_IMAGE:-lumina-library-nginx:latest}
    container_name: apps-lumina-nginx
    depends_on:
      app:
        condition: service_healthy
    # No host port published: Nginx Proxy Manager reaches this container by
    # name over the shared `staigo-network` (NPM forward host: apps-lumina-nginx,
    # port 80). Avoids clashing with NPM's own 80/443 on the host.
    # ponytail: to run WITHOUT NPM, uncomment to expose HTTP directly.
    # ports:
    #   - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - storage_public:/var/www/html/storage/app/public:ro
    networks:
      - internal        # reach app (php-fpm) + reverb
      - staigo-network  # reachable from Nginx Proxy Manager
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── Queue worker ───────────────────────────────────────────────────────
  queue:
    <<: *app-image
    container_name: apps-lumina-queue
    depends_on:
      app:
        condition: service_healthy
    environment:
      CONTAINER_ROLE: queue
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl -c /etc/supervisor/queue.conf status | grep -q RUNNING"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── Scheduler (replaces VPS crontab — see docker/supervisor/scheduler.conf) ─
  scheduler:
    <<: *app-image
    container_name: apps-lumina-scheduler
    depends_on:
      app:
        condition: service_healthy
    environment:
      CONTAINER_ROLE: scheduler
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl -c /etc/supervisor/scheduler.conf status | grep -q RUNNING"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── Laravel Reverb (WebSocket server) ─────────────────────────────────
  reverb:
    <<: *app-image
    container_name: apps-lumina-reverb
    depends_on:
      app:
        condition: service_healthy
    environment:
      CONTAINER_ROLE: reverb
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── MySQL ──────────────────────────────────────────────────────────────
  # OPTIONAL — remove this service (and the `mysql_data` volume below) if
  # DB_HOST in .env already points at an external/managed database.
  mysql:
    image: mysql:8.0
    container_name: apps-lumina-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    networks:
      - internal
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ── Redis (cache, sessions, queue, Reverb scaling channel) ────────────
  redis:
    image: redis:7-alpine
    container_name: apps-lumina-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - internal
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

networks:
  # Private network for app <-> db/redis/reverb. Not reachable from NPM.
  internal:
    driver: bridge
  # Shared external network that Nginx Proxy Manager (and rmtemplate-admin)
  # already live on. Create it once: docker network create staigo-network
  staigo-network:
    external: true

volumes:
  mysql_data:
  redis_data:
  storage_public:
